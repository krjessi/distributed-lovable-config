spring:
  datasource:
    url: jdbc:postgresql://pgvector:5432/intelligence_db
    username: intelligence_user
    password: ${INTELLIGENCE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  kafka:
    bootstrap-servers: kafka:9092

  ai:
    openai:
      api-key: ${AI_API_KEY}

jwt:
  secretKey: ${JWT_SECRET}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://discovery-service.lovable-core.svc.cluster.local:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
