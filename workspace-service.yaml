spring:
  datasource:
    url: jdbc:postgresql://pgvector:5432/workspace_db
    username: workspace_user
    password: ${WORKSPACE_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:9092

  jwt:
    secret-key: ${JWT_SECRET}

minio:
  url: http://minio:9000
  accessKey: ${MINIO_ROOT_USER}
  secretKey: ${MINIO_ROOT_PASSWORD}
  project-bucket: projects
app:
  preview:
    namespace: ${PREVIEW_NAMESPACE}
    domain: ${PREVIEW_DOMAIN}
    proxy-port: ${PROXY_PORT}
