spring:
  datasource:
    url: jdbc:postgresql://pgvector:5432/account_db
    username: account_user
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret-key: ${JWT_SECRET}

stripe:
  api:
    secret: ${STRIPE_API_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}

app:
  frontend:
    url: ${APP_FRONTEND_URL}

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://discovery-service.lovable-core.svc.cluster.local:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
